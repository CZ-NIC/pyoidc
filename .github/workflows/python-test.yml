name: Run tests and quality control

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '15 6 * * *'

permissions: {}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Run tests
      # Windows runs only the test env; docs and quality are platform-independent.
      run: tox ${{ runner.os == 'Windows' && '-e py' || '' }}
      env:
        # The ".coverage." prefix is required for `coverage combine` in the coverage job.
        COVERAGE_FILE: .coverage.${{ runner.os }}-${{ matrix.python }}
    - name: Store coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ runner.os }}-${{ matrix.python }}
        path: .coverage.${{ runner.os }}-${{ matrix.python }}
        include-hidden-files: true
        if-no-files-found: error

  coverage:
    name: Coverage
    needs: build
    # Coverage data are stored for master pushes and reported for PRs; nightly runs have nothing to do.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Forked pull_request runs get a read-only token; their comment is posted by coverage-comment.yml.
      pull-requests: write # Publish/update the coverage comment on trusted PRs
      contents: write # Push the coverage data and badge to the python-coverage-comment-action-data branch
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-*
        merge-multiple: true
    - name: Coverage comment
      id: coverage_comment
      uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MERGE_COVERAGE_FILES: true
        MINIMUM_GREEN: 90
        MINIMUM_ORANGE: 60
    - name: Store Pull Request comment to be posted
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt
    - name: Check coverage did not decrease
      # The absolute floor is fail_under in .coveragerc, enforced by pytest-cov in every test run.
      if: steps.coverage_comment.outputs.new_percent_covered && steps.coverage_comment.outputs.reference_percent_covered
      env:
        NEW: ${{ steps.coverage_comment.outputs.new_percent_covered }}
        REFERENCE: ${{ steps.coverage_comment.outputs.reference_percent_covered }}
      run: |
        python3 - <<'PY'
        import os, sys
        new, ref = float(os.environ["NEW"]), float(os.environ["REFERENCE"])
        print(f"Coverage: PR {new}%, master {ref}%")
        if new < ref:
            print(f"::error::Coverage decreased from {ref}% to {new}%")
            sys.exit(1)
        PY
