[tox]
envlist = py{310,311,312,313},docs,quality
skip_missing_interpreters = True

[testenv]
commands =
    py.test --cov=oic {posargs:tests}
extras = testing
pass_env = COVERAGE_FILE
deps =
  pytest-cov

[testenv:docs]
whitelist_externals = make
extras = docs
commands = sphinx-build -b html doc/ doc/_build/html -W

[testenv:quality]
ignore_errors = True
deps = twine
extras =
    quality
    types
commands =
    ruff check
    ruff format --check
    mypy --config-file mypy.ini src/ tests/
    python3 -m build --sdist
    twine check dist/*

[pep8]
max-line-length=100

[pytest]
addopts = --color=yes
